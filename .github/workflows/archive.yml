name: Archive English lesson
on:
  workflow_dispatch:
    inputs:
      lesson:
        description: Lesson JSON
        required: true
        type: string
      publish:
        description: Commit to main and trigger the existing Netlify integration
        default: false
        type: boolean

permissions: {}
concurrency:
  group: weekly-lesson-archive
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && !inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate lesson
        env:
          LESSON: ${{ inputs.lesson }}
        run: printf '%s' "$LESSON" | python3 scripts/archive.py

  publish:
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Archive lesson and push
        env:
          LESSON: ${{ inputs.lesson }}
        run: |
          printf '%s' "$LESSON" | python3 scripts/archive.py
          if git diff --quiet -- index.html; then
            echo "This lesson is already archived."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'Archive weekly English lesson'
          git push origin HEAD:refs/heads/main
